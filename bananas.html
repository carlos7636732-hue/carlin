<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Site</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #1e1e2f;
      color: #fff;
      text-align: center;
    }
    h1 { font-size: clamp(48px, 10vw, 110px); margin: 0; }
    p { font-size: clamp(20px, 3vw, 32px); margin: 0; opacity: .85; }
    .btn-youtube {
      display: inline-block;
      padding: 28px 80px;
      background: #ff0000;
      color: #fff;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: bold;
      text-decoration: none;
      border-radius: 100px;
    }
    .btn-youtube:hover { background: #cc0000; }
  </style>
</head>
<body>
  <h1>Bem-vindo!</h1>
  <p>Clique no botão abaixo para continuar</p>
  <a class="btn-youtube" href="https://youtu.be/LkBjOeoHBhA?si=lwk77bZnmZcJNLES" target="_blank" rel="noopener">▶ Assistir ao vídeo</a>
</body>
</html>
